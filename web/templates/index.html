<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五子棋 · 表情辅助</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; color: #eeeee6; background: #181e1c; }
    main { max-width: 950px; margin: 0 auto; padding: 24px; }
    header p, .muted { color: #b9c6bb; }
    h1 { font-size: 1.85rem; margin: 0; }
    header p { margin: 4px 0 20px; }
    .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr); gap: 20px; align-items: start; }
    .board {
      display: grid; grid-template-columns: repeat(15, 1fr); aspect-ratio: 1; padding: 3%;
      box-sizing: border-box; border-radius: 12px; background: #dbad70;
    }
    .point { position: relative; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .point::before, .point::after { content: ""; position: absolute; background: #715032; pointer-events: none; }
    .point::before { top: 50%; left: 0; width: 100%; height: 1px; }
    .point::after { top: 0; left: 50%; width: 1px; height: 100%; }
    .point[data-row="0"]::after { top: 50%; height: 50%; }
    .point[data-row="14"]::after { height: 50%; }
    .point[data-col="0"]::before { left: 50%; width: 50%; }
    .point[data-col="14"]::before { width: 50%; }
    .point:focus-visible { z-index: 2; outline: 2px solid #3e654e; }
    .stone { position: absolute; inset: 8%; border-radius: 50%; z-index: 1; pointer-events: none; }
    .black .stone { background: radial-gradient(circle at 35% 30%, #555753, #151614 68%); }
    .white .stone { background: radial-gradient(circle at 35% 30%, #fff, #e5dece 70%); }
    .point:not(:disabled):hover .stone { background: #20201a70; }
    .last .stone::after { content: ""; position: absolute; inset: 36%; border-radius: 50%; background: #c76a42; }
    .panel { padding: 16px; border-radius: 12px; background: #242d28; }
    .panel p { margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .controls button, #camera { border: 1px solid #657b6c; border-radius: 6px; padding: 7px 10px; color: inherit; background: #35483b; cursor: pointer; font: inherit; }
    button:disabled { cursor: default; }
    .controls button:disabled, #camera:disabled { opacity: .5; }
    video { width: 100%; margin-top: 12px; border-radius: 6px; transform: scaleX(-1); }
    #notice { margin-top: 12px; min-height: 1.5em; color: #f0b68e; }
    @media (max-width: 640px) { main { padding: 12px; } .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>五子棋</h1>
    <p>你执黑先行。横、竖或斜线率先连成五枚或更多同色棋子即获胜。</p>
  </header>
  <div class="layout">
    <div id="board" class="board" aria-label="十五路五子棋棋盘"></div>
    <aside class="panel">
      <p id="status" role="status">正在连接对局…</p>
      <p id="difficulty"></p>
      <p id="decision" class="muted"></p>
      <div class="controls">
        <button id="restart" type="button">新局</button>
        <button id="undo" type="button">悔棋</button>
      </div>
      <p class="muted">开启摄像头后，程序会在你的回合分析表情线索，必要时降低 AI 难度。图像仅交给本机程序处理。</p>
      <button id="camera" type="button">开启表情辅助</button>
      <video id="preview" autoplay muted playsinline hidden></video>
      <div id="expression" class="muted"></div>
      <div id="notice" role="status"></div>
    </aside>
  </div>
</main>
<script>
  const byId = (id) => document.getElementById(id);
  const points = [];
  const preview = byId("preview");
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");
  const labels = { angry: "生气", disgust: "厌恶", fearful: "害怕", happy: "高兴", sad: "难过", surprised: "惊讶", neutral: "中性" };
  let state, busy = false, stream, cameraBusy = false, sampleTimer;

  for (let row = 0; row < 15; row++) {
    for (let col = 0; col < 15; col++) {
      const point = document.createElement("button");
      point.type = "button";
      point.className = "point";
      point.dataset.row = row;
      point.dataset.col = col;
      point.disabled = true;
      const stone = document.createElement("span");
      stone.className = "stone";
      point.append(stone);
      point.addEventListener("click", () => act("move", { row, col }));
      byId("board").append(point);
      points.push(point);
    }
  }

  async function request(path, options) {
    const response = await fetch("/api/" + path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "请求失败");
    return data;
  }

  function post(path, data = {}) {
    return request(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  }

  function render() {
    if (!state) return;
    const yourTurn = !state.game_over && state.current_turn === "black";
    points.forEach((point, index) => {
      const row = Math.floor(index / 15);
      const col = index % 15;
      const value = state.board[row][col];
      point.classList.toggle("black", value === state.black);
      point.classList.toggle("white", value === state.white);
      point.classList.toggle("last", state.last_move?.[0] === row && state.last_move?.[1] === col);
      point.disabled = busy || !yourTurn || value !== 0;
      point.setAttribute("aria-label", `第 ${row + 1} 行第 ${col + 1} 列，${value === 0 ? "空位" : value === state.black ? "黑棋" : "白棋"}`);
    });
    byId("status").textContent = state.game_over
      ? (state.winner === "black" ? "你赢了！" : state.winner === "white" ? "白棋获胜" : "和棋")
      : (yourTurn ? "轮到你落子" : "AI 正在思考…");
    byId("difficulty").textContent = "AI 难度 · " + state.difficulty;
    byId("decision").textContent = state.decision;
    byId("undo").disabled = busy || !state.can_undo;
    byId("restart").disabled = busy;
    if (!state.sample_token) byId("expression").textContent = "";
  }

  async function act(path, data) {
    if (busy) return;
    busy = true;
    render();
    byId("notice").textContent = "";
    try {
      applyState(await post(path, data));
    } catch (error) {
      byId("notice").textContent = error.message;
    } finally {
      busy = false;
      render();
    }
  }

  function stopPreview() {
    clearTimeout(sampleTimer);
    stream?.getTracks().forEach((track) => track.stop());
    stream = undefined;
    preview.srcObject = null;
    preview.hidden = true;
    byId("expression").textContent = "";
  }

  async function sample() {
    const capturedStream = stream;
    const token = state?.sample_token;
    try {
      if (!busy && token && preview.videoWidth) {
        canvas.width = Math.min(480, preview.videoWidth);
        canvas.height = Math.round(canvas.width * preview.videoHeight / preview.videoWidth);
        context.drawImage(preview, 0, 0, canvas.width, canvas.height);
        const jpeg = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.75));
        if (jpeg && stream === capturedStream && token === state?.sample_token && !busy) {
          const result = await request("expression", {
            method: "POST", headers: { "Content-Type": "image/jpeg", "X-Observation-Token": token }, body: jpeg
          });
          if (stream === capturedStream && token === state?.sample_token && !busy) {
            byId("expression").textContent = result.label
              ? `表情线索 · ${labels[result.label] || result.label}`
              : (result.message || "等待有效面部图像");
          }
        }
      }
    } catch (error) {
      if (stream === capturedStream) byId("expression").textContent = error.message;
    } finally {
      if (capturedStream && stream === capturedStream) sampleTimer = setTimeout(sample, 250);
    }
  }

  async function toggleCamera() {
    if (cameraBusy || busy) return;
    cameraBusy = true;
    byId("camera").disabled = true;
    try {
      if (stream) {
        stopPreview();
        await act("camera", { enabled: false });
      } else {
        stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
        stream.getVideoTracks()[0].addEventListener("ended", () => {
          stopPreview();
          byId("camera").textContent = "开启表情辅助";
          post("camera", { enabled: false }).then(applyState).catch((error) => {
            byId("notice").textContent = error.message;
          });
        });
        preview.srcObject = stream;
        preview.hidden = false;
        const enabled = await post("camera", { enabled: true });
        // A move response may arrive while permission is being requested.
        applyState(enabled);
        sample();
      }
    } catch (error) {
      stopPreview();
      byId("notice").textContent = "表情辅助未开启。" + error.message;
    } finally {
      byId("camera").textContent = stream ? "关闭表情辅助" : "开启表情辅助";
      byId("camera").disabled = false;
    }
  }

  byId("camera").addEventListener("click", toggleCamera);
  byId("restart").addEventListener("click", () => act("restart"));
  byId("undo").addEventListener("click", () => act("undo"));
  window.addEventListener("pagehide", () => {
    if (stream) navigator.sendBeacon("/api/camera", new Blob(['{"enabled":false}'], { type: "application/json" }));
    stopPreview();
  });

  function applyState(latest) {
    if (!state || latest.revision >= state.revision) {
      state = latest;
      render();
    }
  }

  async function refresh() {
    try {
      if (!busy && (!state || state.current_turn === "white" && !state.game_over)) {
        const latest = await request("state");
        if (!busy) applyState(latest);
      }
    } catch (error) {
      byId("notice").textContent = error.message;
    } finally {
      setTimeout(refresh, 300);
    }
  }
  refresh();
</script>
</body>
</html>
